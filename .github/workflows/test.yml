name: CVMFS ROOT Test

on:
  push:
  pull_request:
  schedule:
    # Run daily at 06:00 UTC to catch any CVMFS file changes
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mount CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v4
        with:
          cvmfs_repositories: sft.cern.ch

      - name: Run ROOT macro
        run: |
          source /cvmfs/sft.cern.ch/lcg/views/LCG_108/x86_64-el9-gcc15-opt/setup.sh          
          root -b -q -l count_events.C > output.txt

      - name: Compare output to baseline
        run: |
          echo "=== Produced output ==="
          cat output.txt
          echo "=== Expected output ==="
          cat expected_output.txt
          if diff -q output.txt expected_output.txt > /dev/null 2>&1; then
            echo "PASS: output matches expected"
          else
            echo "FAIL: output differs from expected"
            diff expected_output.txt output.txt
            exit 1
          fi
